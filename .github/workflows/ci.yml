name: CI

# Showcase copy: this workflow only runs when started by hand, and the two
# image jobs build without publishing. The original repository runs it on
# every push and publishes both images to GHCR - see docs/CASE_STUDY.md.
on:
  workflow_dispatch: {}

env:
  flutter-version: '3.47.1'

jobs:
  core:
    name: core/ - analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: stable
      - run: dart pub get
        working-directory: core
      - run: dart analyze
        working-directory: core
      - run: dart test
        working-directory: core

  app:
    name: app/ - analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  # Real native builds, not just analyze/test - GitHub's hosted runners
  # already have Visual Studio (windows-latest) and the Android SDK
  # (ubuntu-latest) preinstalled, which sidesteps the toolchain gaps on the
  # machine this repo was developed on. Only runs on main/manual trigger,
  # not every WIP push - these take longer than the analyze/test jobs above.
  build-windows:
    name: app/ - build Windows
    runs-on: windows-latest
    needs: app
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      # Output path matches current Flutter Windows build layout - not yet
      # confirmed against a real run of this workflow, adjust if the
      # upload step can't find it.
      - uses: actions/upload-artifact@v4
        with:
          name: handles-windows
          path: app/build/windows/x64/runner/Release/

  build-android:
    name: app/ - build Android APK
    runs-on: ubuntu-latest
    needs: app
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: stable
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: handles-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  # Builds the reconciliation daemon's image and pushes it to GitHub
  # Container Registry (ghcr.io) - free, comes with the repo, no separate
  # registry account to set up. This is the actual "CI/CD -> live updates"
  # loop: push code -> tests run -> (on main) a new image is published ->
  # pull it wherever it's deployed to update (see docs/DEPLOYMENT.md -
  # this workflow does NOT reach into your home network or a Raspberry Pi
  # cluster to deploy it for you; auto-deploying somewhere you self-host
  # is a separate, harder problem than auto-building the image, and out
  # of scope for now).
  #
  # Multi-platform (linux/amd64 + linux/arm64): this runner is amd64
  # hardware, but a Raspberry Pi is arm64 - without this, the image built
  # here simply wouldn't run there. QEMU lets the runner emulate arm64
  # well enough to compile and run an arm64 image during the build (slower
  # than a native build, since it's emulated, but correct); Buildx is
  # what actually drives a multi-platform build and pushes one manifest
  # that both architectures resolve correctly against - `docker pull`
  # picks the right one for whatever machine runs it automatically.
  build-docker-image:
    name: core/ - build & push Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: core
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a separate secret to create/rotate - scoped
          # to this repo automatically, and only usable by this workflow.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/handles-reconcile-daemon
          # `latest` for "pull the newest build", the commit SHA for
          # "pin to exactly this build" - both tags point at the same
          # image, just different ways to refer to it later.
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./core
          # Explicit now that core/Dockerfile has two final stages
          # (daemon, api) - without this, buildx builds the last stage in
          # the file, which would silently publish the wrong image the
          # moment a second stage got added.
          target: daemon
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Same shape as build-docker-image above, for the catalog API
  # (docs/PROJECT_PLAN.md section 2, 2026-09-02) - a separate job rather
  # than a matrix, matching how build-windows/build-android stay separate
  # named jobs in this file rather than one parameterized job.
  build-catalog-api-image:
    name: core/ - build & push catalog API image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: core
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/handles-catalog-api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./core
          target: api
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
