# TEMPLATE ONLY - copy to secret.yaml (gitignored, see .gitignore's
# `k8s/secret.yaml` entry), fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# Never commit the filled-in version - a Kubernetes Secret is only
# base64-*encoded*, not encrypted, in etcd by default. Anyone who can
# `kubectl get secret -o yaml` on this namespace can read these values in
# plaintext - worth discussing with whoever administers the cluster
# before real credentials ever land here (see k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: handles-git-credentials
  namespace: handles
type: Opaque
stringData:
  # A fine-grained GitHub personal access token, scoped to ONLY this repo,
  # with just Contents: Read and write. Not your own login token, and not
  # broader than this one repo needs.
  GIT_PAT: 'github_pat_xxx'
---
apiVersion: v1
kind: Secret
metadata:
  name: handles-ebay-secrets
  namespace: handles
type: Opaque
stringData:
  # One key per connected eBay account - same shape as
  # core/secrets/<account_key>.json (client credentials + Business Policy
  # IDs + OAuth tokens all together), just delivered as a Kubernetes
  # Secret's files instead of a locally-mounted directory. The daemon
  # doesn't know or care which mechanism supplied /app/secrets - see
  # core/lib/src/credential_store.dart's FileCredentialStore.
  ebay_store_a.json: |
    {
      "client_id": "...",
      "client_secret": "...",
      "redirect_uri": "...",
      "fulfillment_policy_id": "...",
      "payment_policy_id": "...",
      "return_policy_id": "...",
      "access_token": "...",
      "refresh_token": "...",
      "access_token_expires_at": "..."
    }
